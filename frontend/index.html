<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#167a5b" />
    <meta name="application-name" content="LiveMatch" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiveMatch" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/livematch-192.png" />
    <link rel="apple-touch-icon" href="/icons/livematch-192.png" />
    <title>LiveMatch</title>
    <script>
      try {
        if (localStorage.getItem('livematch.theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch {
        document.documentElement.classList.remove('dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
